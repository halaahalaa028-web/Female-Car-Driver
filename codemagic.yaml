workflows:
  female-car-driver-ios:
    name: Female Car Driver iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Banuvra-iOS-Package
    environment:
      ios_signing:
        provisioning_profiles:
          - Female Car Driver App Store Push 2026
        certificates:
          - ElShroq Apple Distribution 2026
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
