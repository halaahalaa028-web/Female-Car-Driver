workflows:
  female-car-driver-ios:
    name: Female Car Driver iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Banuvra-iOS-Package
    environment:
      ios_signing:
        provisioning_profiles:
          - Female Car Driver App Store Push 2026
        certificates:
          - ElShroq Apple Distribution 2026
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Clean and reinstall CocoaPods dependencies
        script: |
          cd ios
          rm -rf Pods .symlinks Flutter/Flutter.podspec Podfile.lock
          pod install --repo-update
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          if xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --archive-flags="-destination 'generic/platform=iOS'"; then
            echo "IPA archive completed successfully."
          else
            BUILD_STATUS=$?
            echo "===== XCODE BUILD LOGS (LAST 250 LINES) ====="
            for LOG in /tmp/xcodebuild_logs/*.log; do
              if [ -f "$LOG" ]; then
                echo "===== $LOG ====="
                tail -n 250 "$LOG"
              fi
            done
            exit "$BUILD_STATUS"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
